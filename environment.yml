# Tested GPU environment (CUDA 12.8). On a machine without NVIDIA GPUs use
# `pip install -r requirements.txt` in a Python 3.10 environment instead.
name: sclumen
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu128
      - torch==2.7.1+cu128
      - numpy==1.26.4
      - pandas==2.1.4
      - POT==0.9.6.post1
      - scipy>=1.10
      - torchdiffeq==0.2.5
      - geomloss==0.3.1
      - matplotlib==3.8.2
      - scikit-learn==1.7.2
      - tqdm==4.67.3
